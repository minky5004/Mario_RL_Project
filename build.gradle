plugins {
    id 'java'
    id 'application'
}

group = 'com.mario.rl'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JSON 직렬화/역직렬화 (Python 서버와의 소켓 통신용)
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // 프로그램 진입점
    mainClass = 'com.mario.rl.Main'
}

// [DAY9] `gradlew run` 의 -Dmario.* 시스템 프로퍼티를 애플리케이션 JVM 으로 전달한다.
// (application 플러그인의 run 은 기본적으로 Gradle JVM 프로퍼티를 앱에 넘기지 않음)
//   예: ./gradlew run -Dmario.seed=1 -Dmario.save=q-seed1.bin
run {
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('mario.') }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 한글 주석/문자열이 OS 기본 인코딩(cp949)이 아닌 UTF-8로 컴파일되도록 강제
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
